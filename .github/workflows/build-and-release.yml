name: Build and Release Wails v3 App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package Windows App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install NSIS Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis pkg-config build-essential libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Update Build Assets
        run: |
          wails3 update build-assets -name "YStreamUtils" -config build/config.yml -dir build
      - name: Build Linux App
        run: wails3 build GOOS=linux GOARCH=amd64

      - name: Build Windows App
        run: wails3 build GOOS=windows GOARCH=amd64

      - name: Package Windows App
        run: wails3 package GOOS=windows GOARCH=amd64

      - name: Create GitHub Release and Upload Installer
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: bin/*
