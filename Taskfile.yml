version: "3"

vars:
  TIMESTAMP:
    sh: powershell -NoProfile -Command "Get-Date -Format 'yyyyMMddHHmmss'"
  
  CORE_PROJECT: "src/YStreamUtils.Core/YStreamUtils.Core.csproj"
  WEB_PROJECT: "src/YStreamUtils.Web/YStreamUtils.Web.csproj"

tasks:
  migrate:add:
    desc: "Generate a new local SQLite migration (based off the Web project context scaffolding). Usage -> task migrate:add name=MigrationName"
    vars:
      RESOLVED_NAME: '{{default (default (printf "AutoMigration_%s" .TIMESTAMP) .CLI_ARGS) .name}}'
    env:
      EF_PROVIDER: "sqlite"
    cmds:
      - echo "Generating SQLite migration '{{.RESOLVED_NAME}}_sqlite'..."
      - dotnet ef migrations add {{.RESOLVED_NAME}}_sqlite --project {{.CORE_PROJECT}} --startup-project {{.WEB_PROJECT}} --context SqliteDbContext --output-dir Core/Data/Migrations/Sqlite

  codegen:frontend:
    desc: "Generates type-safe Svelte TypeScript API clients automatically based on the Web project schema"
    env:
      ASPNETCORE_ENVIRONMENT: "Development"
    deps: [build:backend]
    dir: "frontend-sk"
    cmds:
      - npm run codegen

  dev:
    desc: "Dev dev dev dev"
    env:
      ASPNETCORE_ENVIRONMENT: "Development"
    deps: [codegen:frontend, dev:backend, dev:frontend]
      
  dev:backend:
    desc: "Starts just the backend with watch"
    env:
      ASPNETCORE_ENVIRONMENT: "Development"
    dir: "YStreamUtils.Web"
    cmds:
      - echo "Starting .NET Watch"
      - dotnet watch run -- --port 5000
  
  dev:frontend:
    desc: "Starts just the frontend with watch"
    dir: "frontend-sk"
    cmds:
      - echo "Starting Vite Dev Server"
      - npm run dev
  
  
  build:frontend:
    desc: ""
    dir: "frontend-sk"
    cmds:
      - npm run build

  build:backend:
    desc: ""
    dir: "YStreamUtils.Web"
    cmds:
      - dotnet build -c Debug
  
  build:prod:
    desc: "Compiles optimized production static UI bundles and publishes clean release binaries"
    env:
      ASPNETCORE_ENVIRONMENT: "Production"
    cmds:
      - for:
          matrix:
            OS: [ win-x64, linux-x64, linux-arm64, osx-arm64 ]
        cmd: dotnet publish {{.WEB_PROJECT}} -c Release -r {{.ITEM.OS}} -o ./dist/web/YStreamutils-{{.ITEM.OS}} /p:PublishSingleFile=true /p:SelfContained=true
